name: Ежедневное обновление радара

on:
  schedule:
    # 03:40 UTC вт–сб: daily-index EDGAR за прошедший торговый день публикуется ~22:00 ET (02:00 UTC)
    - cron: "40 3 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily.yml"
      - "scripts/**"
      - "web/**"
      - "package.json"

permissions:
  contents: write   # форс-пуш снапшота на ветку data
  pages: write
  id-token: write

# Публикация не отменяется на полпути — иначе Pages останется в подвешенном состоянии.
# Группа общая с бэкфилом: оба форс-пушат ветку data, и при параллельном запуске снапшот
# одного затирал бы снапшот другого. Общая группа выстраивает их в очередь.
concurrency:
  group: insider-radar-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Восстановить данные с ветки data
        run: |
          mkdir -p data
          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git archive --format=tar origin/data | tar -x -C data
            echo "Данные восстановлены: $(du -sh data | cut -f1)"
          else
            echo "Ветки data ещё нет — первый запуск (сначала выполните backfill)"
          fi

      - name: Самотесты
        run: npm test

      - name: Живой контур EDGAR
        run: node scripts/live.mjs --time-budget-min 60

      # Инкрементально: прошлые кварталы в состоянии, перечитывается только текущий form.idx
      - name: Обновление цен
        run: node scripts/prices.mjs --mode daily --time-budget-min 55

      # Делистнутые бумаги: Yahoo их не отдаёт, поэтому выжившесть закрывается только
      # через Tiingo. С 16.08.2026 тариф платный (Power): 10 000 запросов в час,
      # 100 000 в сутки, 40 ГБ трафика в месяц. Идём на 6000 в час — 60% часового лимита,
      # запас на случай параллельного ручного прогона по тому же аккаунту.
      # При 429 скрипт ждёт и возвращает символ в очередь, а не обрывает прогон.
      #
      # ВНИМАНИЕ: узкое место тарифа — не запросы, а ТРАФИК. Полная история одной бумаги
      # с 2005 года весит около 0.5–1 МБ, то есть 40 ГБ хватает примерно на 40–80 тыс.
      # выгрузок в месяц. Очередь берёт только тикеры БЕЗ кэша, поэтому ежедневный прогон
      # стоит копейки; а вот массовое переуглубление всех рядов — разовая операция,
      # и запускать её из этого шага нельзя.
      #
      # Бюджет 30 минут выбран так, чтобы сумма шагов (60 + 55 + 30) осталась заметно ниже
      # timeout-minutes: 170 у всей задачи. На 6000 в час это до 3000 символов за прогон —
      # хватает и на всплеск очереди после расширения истории EDGAR. Очередь резюмируемая:
      # недобранное уйдёт в следующий прогон.
      # Глубина 2005 года — задел под слепую проверку на 2006–2015 (docs/ЧТО-РАБОТАЕТ.md).
      # Без секрета TIINGO_TOKEN шаг завершается сразу и ничего не меняет.
      - name: Котировки делистнутых (Tiingo, необязательно)
        continue-on-error: true
        env:
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
        run: >-
          node scripts/tiingo.mjs --time-budget-min 30
          --month-cap 999999 --req-per-hour 6000 --concurrency 6 --from 2005-01-01
          --include-unverified

      # Внутридневные минимумы для гейта discount. История залита разовым снимком Sharadar
      # (подписка была месячной), а свежие даты добираются из Yahoo — он отдаёт low бесплатно.
      # Без этого шага новые сделки остались бы без диапазона, и ложные отсевы вернулись бы
      # ровно на тех бумагах, которые смотрят живьём (см. docs/АУДИТ-ГЕЙТОВ.md).
      - name: Минимумы дня для гейта дисконта
        continue-on-error: true
        run: node scripts/lows.mjs --time-budget-min 10

      - name: Вычисления и payload
        run: node scripts/compute.mjs

      - name: Сборка сайта
        run: cp web/* site/

      # Гейт публикации: пустой или неполный payload не публикуется поверх рабочего
      - name: Проверка payload перед публикацией
        run: |
          node -e "
            const fs = require('fs');
            const meta = JSON.parse(fs.readFileSync('site/data/meta.json', 'utf8'));
            if (!meta.trades || meta.trades.buys < 1000) { console.error('Гейт: подозрительно мало покупок', meta.trades); process.exit(1); }
            if (!fs.existsSync('site/data/feed.json') || !fs.existsSync('site/data/stats.json')) { console.error('Гейт: нет ключевых файлов payload'); process.exit(1); }
            console.log('Гейт пройден: покупок', meta.trades.buys);
          "

      - name: Telegram-уведомления (необязательно)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEXUS_EVENTS_URL: ${{ vars.NEXUS_EVENTS_URL }}
          NEXUS_INGEST_TOKEN: ${{ secrets.NEXUS_INGEST_TOKEN }}
          NEXUS_SITES_TOKEN: ${{ secrets.NEXUS_SITES_TOKEN }}
        run: node scripts/notify.mjs

      # Ветка data — одиночный снапшот-коммит (форс-пуш): история не копится,
      # репозиторий не растёт на десятки МБ в день от переписываемых кэшей цен
      - name: Снапшот на ветку data
        run: |
          cd data
          rm -rf .git
          git init -q -b data
          git config user.name "insider-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "data snapshot $(date -u +%FT%TZ)"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data

      - name: Артефакт Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Публикация Pages
        id: deployment
        uses: actions/deploy-pages@v4
