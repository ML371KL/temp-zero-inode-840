# Воркер живых котировок и приёмник журнала вечерней схемы на бумаге (/paper/...).
name = "radar840-quotes"
main = "index.js"
compatibility_date = "2026-08-03"

# Адрес вида radar840-quotes.<поддомен>.workers.dev — его же прописан в web/app.js
workers_dev = true

# Журнал вечерней схемы: бакет заводит владелец (wrangler r2 bucket create radar840-paper) ДО выкладки воркера —
# привязка к несуществующему бакету не пройдёт. Секрет приёма: wrangler secret put PAPER_TOKEN.
[[r2_buckets]]
binding = "PAPER"
bucket_name = "radar840-paper"

[observability]
enabled = true
